<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="YmG9uChEWeqwRHwRWYcZtp-oxgAI4YzZkbckXilYD14">
<meta name="description" content="Book's Club: a community forum to talk about the books you love.">
<title>Book's Club</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<header><div class="wrap bar">
  <a class="brand" href="#">Book's Club</a>
  <button class="btn" id="theme" aria-label="Switch light or dark theme">Theme</button>
  <div id="auth"></div>
</div></header>

<main>
<section class="wrap hero">
  <div>
    <h1>Finish the book. Then come argue about it.</h1>
    <p>Book's Club is a forum for readers. Start a discussion, recommend a title, or tell us how that ending landed.</p>
    <button class="btn primary" id="startBtn">Start a discussion</button>
  </div>
  <div>
    <div class="shelf" id="shelf" role="group" aria-label="Browse by category"></div>
    <p class="shelf-note">Pick a spine to filter the discussions below.</p>
  </div>
</section>

<section class="wrap forum" id="forum">
  <h2>Discussions</h2>
  <div class="tools">
    <input id="q" type="search" placeholder="Search titles and posts" aria-label="Search discussions">
    <select id="catFilter" aria-label="Filter by category"></select>
  </div>
  <div id="list" aria-live="polite"></div>
</section>
</main>

<footer>powered by •ＵᏒ-１３•𓂀</footer>

<dialog id="authDlg">
  <h2 id="authTitle">Welcome back</h2>
  <div class="tabs" role="tablist">
    <button class="btn" role="tab" id="tabLogin" aria-selected="true">Log in</button>
    <button class="btn" role="tab" id="tabReg" aria-selected="false">Create account</button>
  </div>
  <form id="authForm">
    <label class="field" id="nameRow" hidden><span>Display name</span><input id="nameIn" maxlength="30" autocomplete="nickname"></label>
    <label class="field"><span>Email</span><input id="emailIn" type="email" required autocomplete="email"></label>
    <label class="field"><span>Password (6+ characters)</span><input id="passIn" type="password" required minlength="6" autocomplete="current-password"></label>
    <p class="err" id="authErr"></p>
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="authSubmit">Log in</button></div>
  </form>
</dialog>

<dialog id="postDlg">
  <h2>New discussion</h2>
  <form id="postForm">
    <label class="field"><span>Category</span><select id="pCat"></select></label>
    <label class="field"><span>Title</span><input id="pTitle" required maxlength="120"></label>
    <label class="field"><span>What do you want to say?</span><textarea id="pBody" required maxlength="3000"></textarea></label>
    <div class="row"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Publish</button></div>
  </form>
</dialog>

<dialog id="threadDlg">
  <div id="threadHead"></div>
  <div id="replies"></div>
  <form id="replyForm">
    <label class="field"><span>Your reply</span><textarea id="rBody" class="short" required maxlength="1500"></textarea></label>
    <div class="row"><button type="button" class="btn" data-close>Close</button><button class="btn primary">Reply</button></div>
  </form>
  <div id="replyLogin" hidden class="row"><button type="button" class="btn" data-close>Close</button><button class="btn primary" data-login>Log in to reply</button></div>
</dialog>

<div id="toast" role="status"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
